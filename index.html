<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DwwTik — Download Videos</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #08090c;
    --card: #111318;
    --border: #242731;
    --text: #ffffff;
    --muted: #8d929e;
    --green: #7cff9b;
}

body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 50% -10%, #18201b 0%, #0b0c10 42%, #08090c 75%);
    color: var(--text);
    padding: 24px 18px 50px;
}

.container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}

/* Header */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 70px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: var(--green);
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #9297a2;
    font-size: 13px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(124,255,155,.6);
}

/* Hero */

.hero {
    text-align: center;
    margin-bottom: 34px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border: 1px solid #252a31;
    border-radius: 999px;
    background: rgba(255,255,255,.025);
    color: #9ca1ac;
    font-size: 12px;
    margin-bottom: 20px;
}

.badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
}

h1 {
    font-size: clamp(38px, 8vw, 62px);
    line-height: 1;
    letter-spacing: -3px;
    font-weight: 850;
    margin-bottom: 17px;
}

h1 span {
    color: var(--green);
}

.subtitle {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
}

/* Platforms */

.platforms {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

.platform {
    flex: 1;
    height: 45px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0d0f13;
    color: #8e939e;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.platform.active {
    color: white;
    border-color: #4b515d;
    background: #171a20;
}

.platform.disabled {
    opacity: .42;
    cursor: default;
}

/* Main card */

.card {
    background: rgba(17,19,24,.92);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 25px 80px rgba(0,0,0,.35);
}

/* Input */

.input-wrap {
    position: relative;
}

.input {
    width: 100%;
    height: 58px;
    border: 1px solid #30343d;
    border-radius: 14px;
    background: #0b0d11;
    color: white;
    padding: 0 18px;
    padding-right: 112px;
    outline: none;
    font-size: 15px;
    transition: .2s;
}

.input:focus {
    border-color: #666d78;
}

.input::placeholder {
    color: #666b76;
}

.paste-btn {
    position: absolute;
    right: 7px;
    top: 7px;
    height: 44px;
    padding: 0 15px;
    border: 0;
    border-radius: 10px;
    background: #1a1d23;
    color: #c8ccd3;
    font-weight: 600;
    cursor: pointer;
}

.paste-btn:active {
    transform: scale(.97);
}

/* Download button */

.download-btn {
    width: 100%;
    height: 58px;
    margin-top: 12px;
    border: 0;
    border-radius: 14px;
    background: white;
    color: #090a0d;
    font-size: 16px;
    font-weight: 750;
    cursor: pointer;
    transition: .2s;
}

.download-btn:hover {
    transform: translateY(-1px);
    opacity: .93;
}

.download-btn:disabled {
    background: #272a31;
    color: #686d77;
    cursor: not-allowed;
    transform: none;
}

/* Result */

.result {
    display: none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
}

.result-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 7px;
}

.result-text {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.preview {
    display: none;
    width: 100%;
    max-height: 430px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
}

/* Download options */

.options {
    display: none;
    gap: 9px;
    margin-top: 15px;
}

.option-btn {
    flex: 1;
    height: 52px;
    border-radius: 12px;
    border: 1px solid #30343d;
    background: #17191f;
    color: white;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
}

.option-btn.primary {
    background: white;
    color: #090a0d;
    border-color: white;
}

.option-btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 25px;
    color: #555a65;
    font-size: 12px;
}

.footer strong {
    color: #777c86;
}

/* Mobile */

@media (max-width: 600px) {

    body {
        padding: 18px 14px 40px;
    }

    .header {
        margin-bottom: 55px;
    }

    .status {
        font-size: 11px;
    }

    h1 {
        letter-spacing: -2px;
    }

    .subtitle {
        font-size: 14px;
    }

    .card {
        padding: 16px;
        border-radius: 18px;
    }

    .platform {
        font-size: 12px;
    }

    .options {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">Dww<span>Tik</span></div>

        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>
    </header>

    <section class="hero">

        <div class="badge">
            <div class="badge-dot"></div>
            Fast & simple video downloader
        </div>

        <h1>Download.<br><span>Without limits.</span></h1>

        <p class="subtitle">
            Paste a video link and download it in seconds.
        </p>

    </section>

    <div class="platforms">

        <button class="platform active" type="button">
            TikTok
        </button>

        <button class="platform disabled" type="button">
            Instagram
        </button>

        <button class="platform disabled" type="button">
            X
        </button>

    </div>

    <section class="card">

        <div class="input-wrap">

            <input
                id="urlInput"
                class="input"
                type="url"
                placeholder="Paste TikTok link here..."
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <button
                id="pasteButton"
                class="paste-btn"
                type="button"
            >
                Paste
            </button>

        </div>

        <button
            id="downloadButton"
            class="download-btn"
            type="button"
        >
            Download video
        </button>

        <div id="result" class="result">

            <img
                id="videoPreview"
                class="preview"
                alt="Video preview"
            >

            <div id="resultTitle" class="result-title">
                Ready
            </div>

            <div id="resultText" class="result-text">
                Processing...
            </div>

            <div id="options" class="options">

                <button
                    id="noWatermarkButton"
                    class="option-btn primary"
                    type="button"
                >
                    Download without watermark
                </button>

                <button
                    id="watermarkButton"
                    class="option-btn"
                    type="button"
                    disabled
                >
                    With watermark
                </button>

            </div>

        </div>

    </section>

    <div class="footer">
        <strong>DwwTik</strong> · Simple. Fast. Clean.
    </div>

</div>

<script>

const urlInput = document.getElementById("urlInput");
const pasteButton = document.getElementById("pasteButton");
const downloadButton = document.getElementById("downloadButton");

const result = document.getElementById("result");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

const videoPreview = document.getElementById("videoPreview");
const options = document.getElementById("options");
const noWatermarkButton =
    document.getElementById("noWatermarkButton");
    const watermarkButton =
    document.getElementById("watermarkButton");


/* Paste */

pasteButton.addEventListener("click", async function () {

    try {

        const text = await navigator.clipboard.readText();

        if (!text) {
            result.style.display = "block";
            resultTitle.textContent = "Nothing to paste";
            resultText.textContent = "Copy a TikTok link first.";
            return;
        }

        urlInput.value = text;

        result.style.display = "none";

    } catch {

        urlInput.focus();

    }

});


/* Download / Process */

downloadButton.addEventListener("click", processVideo);


async function processVideo() {

    const url = urlInput.value.trim();

    if (!url) {

        result.style.display = "block";
        resultTitle.textContent = "Link required";
        resultText.textContent = "Please paste a TikTok link first.";

        return;
    }


    try {

        const parsedUrl = new URL(url);

        const validTikTok =
            parsedUrl.hostname === "tiktok.com" ||
            parsedUrl.hostname.endsWith(".tiktok.com");

        if (!validTikTok) {

            result.style.display = "block";
            resultTitle.textContent = "Invalid link";
            resultText.textContent =
                "Please enter a valid TikTok URL.";

            return;
        }

    } catch {

        result.style.display = "block";
        resultTitle.textContent = "Invalid link";
        resultText.textContent =
            "Please enter a valid TikTok URL.";

        return;
    }


    result.style.display = "block";
    options.style.display = "none";
    videoPreview.style.display = "none";

    resultTitle.textContent = "Checking link...";
    resultText.textContent = "Please wait a moment.";

    downloadButton.disabled = true;


    try {

        const response = await fetch("/api/download", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                url: url
            })

        });


        const data = await response.json();


        if (!response.ok || !data.ok) {

            resultTitle.textContent = "Couldn't process link";
            resultText.textContent =
                data.error ||
                "Something went wrong. Please try again.";

            return;
        }


        const videoUrl =
            data.video?.hd ||
            data.video?.url;


        if (!videoUrl) {

            resultTitle.textContent = "Video not found";
            resultText.textContent =
                "No downloadable video was returned.";

            return;
        }


        /* Preview */

        if (data.video?.cover) {

            videoPreview.src = data.video.cover;
            videoPreview.style.display = "block";

        }


        resultTitle.textContent = "Video ready ✓";
        resultText.textContent =
            data.video?.title ||
            "Your video is ready to download.";

        options.style.display = "flex";

        downloadButton.disabled = false;
watermarkButton.disabled = false;

        /* Download */

        noWatermarkButton.onclick = function () {

            resultText.textContent =
                "Preparing your download...";

            const link = document.createElement("a");

            link.href =
                "/api/file?url=" +
                encodeURIComponent(videoUrl);

            link.download = "DwwTik-video.mp4";

            document.body.appendChild(link);

            link.click();

            link.remove();

            resultText.textContent =
                "Download started ✓";

        };
watermarkButton.onclick = function () {
    resultText.textContent = "Preparing your download...";

    const watermarkUrl = data.video?.watermark;
resultText.textContent =
    "NO WM:\n" +
    data.video?.url +
    "\n\nWM:\n" +
    watermarkUrl;
    if (!watermarkUrl) {
        resultText.textContent =
            "Watermark video is not available.";
        return;
    }
    
    const link = document.createElement("a");

    link.href = watermarkUrl;

    link.download = "DwwTik-video-watermark.mp4";

    document.body.appendChild(link);

    link.click();

    link.remove();

    resultText.textContent =
        "Download started ✓";
};

    } catch (error) {

        resultTitle.textContent = "Connection error";
        resultText.textContent =
            "Please check your connection and try again.";

    }

}

</script>

</body>
</html>
