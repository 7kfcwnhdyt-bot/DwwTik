<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DwwTik - Video Tools</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #0f0f12;
      color: white;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      padding-top: 10vh;
    }

    .logo {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9b9ba3;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .card {
      background: #19191e;
      border: 1px solid #292930;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .input {
      width: 100%;
      height: 58px;
      border: 1px solid #36363e;
      border-radius: 13px;
      background: #101014;
      color: white;
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }

    .input:focus {
      border-color: #777780;
    }

    .download-button {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 13px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-button:active {
      transform: scale(0.99);
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 22px;
      border-radius: 18px;
      background: #141419;
      border: 1px solid #303039;
      text-align: left;
    }

    .result-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .result-text {
      color: #9999a2;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
      word-break: break-word;
    }

    .option {
      width: 100%;
      height: 52px;
      border-radius: 11px;
      border: 1px solid #36363e;
      background: #202027;
      color: white;
      font-size: 15px;
      font-weight: 600;
      margin-top: 10px;
      cursor: pointer;
    }

    .option.primary {
      background: white;
      color: #111;
      border-color: white;
    }

    .option.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 25px;
      color: #8e8e97;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .note {
      margin-top: 25px;
      color: #66666f;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      color: #777780;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        padding-top: 7vh;
      }

      .logo {
        font-size: 38px;
      }

      .subtitle {
        font-size: 15px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">DwwTik</div>

    <div class="subtitle">
      Simple and fast video tools
    </div>

    <section class="card">

      <input
        id="videoUrl"
        class="input"
        type="url"
        placeholder="Paste your TikTok URL here..."
      >

      <button
        class="download-button"
        onclick="processVideo()"
      >
        Download
      </button>

      <div id="result" class="result">

        <div class="result-title">
          Link accepted ✓
        </div>

        <div id="resultText" class="result-text">
          Your video link is ready to process.
        </div>

        <button class="option primary disabled">
          Download without watermark
        </button>

        <button class="option disabled">
          Download with watermark
        </button>

        <div class="note">
          Download processing will be connected in the next step.
        </div>

      </div>

    </section>

    <div class="features">
      <div class="feature">✓ Simple</div>
      <div class="feature">✓ Fast</div>
      <div class="feature">✓ Free</div>
    </div>

    <div class="footer">
      DwwTik — Video Tools
    </div>

  </main>

  <script>
    function processVideo() {

      const input = document.getElementById("videoUrl");
      const result = document.getElementById("result");
      const resultText = document.getElementById("resultText");

      const url = input.value.trim();

      if (!url) {
        input.focus();
        return;
      }

      result.style.display = "block";

      resultText.textContent =
        "Video link received: " + url;

      result.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }
  </script>

</body>
</html>
