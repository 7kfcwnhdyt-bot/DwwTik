<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DwwTik - Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #0f0f12;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #a5a5ad;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .download-box {
      background: #19191e;
      border: 1px solid #292930;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
    }

    .input {
      width: 100%;
      height: 58px;
      border: 1px solid #34343c;
      border-radius: 12px;
      background: #101014;
      color: white;
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }

    .input:focus {
      border-color: #666670;
    }

    .download-button {
      width: 100%;
      height: 58px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #111;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .download-button:active {
      transform: translateY(0);
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 25px;
      color: #8e8e97;
      font-size: 14px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .watermark {
      margin-top: 30px;
      color: #777780;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 36px;
      }

      .subtitle {
        font-size: 15px;
      }

      .download-box {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">DwwTik</div>

    <div class="subtitle">
      Simple and fast video tools
    </div>

    <div class="download-box">

      <input
        id="videoUrl"
        class="input"
        type="url"
        placeholder="Paste your TikTok URL here..."
      >

      <button
        class="download-button"
        onclick="startDownload()"
      >
        Download
      </button>

    </div>

    <div class="features">
      <div class="feature">✓ Simple</div>
      <div class="feature">✓ Fast</div>
      <div class="feature">✓ Free</div>
    </div>

    <div class="watermark">
      DwwTik — Video Tools
    </div>

  </main>

  <script>
    function startDownload() {
      const input = document.getElementById("videoUrl");
      const url = input.value.trim();

      if (!url) {
        alert("Please paste a TikTok URL first.");
        return;
      }

      alert("Video processing will be added next.");
    }
  </script>

</body>
</html>
